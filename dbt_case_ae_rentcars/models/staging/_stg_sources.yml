version: 2

sources:
  - name: raw_rentcars
    description: "Fontes de dados brutos extraídos da plataforma Rentcars."
    meta:
      external_location: "data/{name}.csv"
    tables:
      - name: raw_partners
        description: "Informações de cadastro de locadoras parceiras da plataforma com status, tiers e comissões."
        columns:
          - name: partner_id
            description: "Identificador único do parceiro (ex: PRT0001)."
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: partner_name
            description: "Nome comercial da locadora."
            tests:
              - not_null
          - name: country
            description: "País de operação principal (código ISO 3166-1 alpha-2)."
          - name: tier
            description: "Categoria comercial do parceiro (gold, silver, bronze)."
          - name: status
            description: "Status de ativação na plataforma (active, inactive, suspended)."
            tests:
              - not_null
          - name: commission_rate
            description: "Taxa de comissão acordada em decimal (ex: 0.1200 = 12%)."
            tests:
              - not_null
          - name: created_at
            description: "Data e hora de cadastro do parceiro."
            tests:
              - not_null
          - name: updated_at
            description: "Data e hora da última atualização do registro."
          - name: contact_email
            description: "E-mail de contato operacional do parceiro."

      - name: raw_sessions
        description: "Registro de todas as sessões de navegação iniciadas no site da Rentcars."
        columns:
          - name: session_id
            description: "Identificador único (UUID) da sessão."
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: user_id
            description: "Identificador (UUID) do usuário autenticado. Nulo indica visitante anônimo."
          - name: started_at
            description: "Timestamp de início da sessão."
            tests:
              - not_null
          - name: ended_at
            description: "Timestamp de encerramento da sessão."
          - name: channel
            description: "Canal de aquisição da sessão (ex: google_cpc, direct, affiliate)."
          - name: device
            description: "Tipo de dispositivo utilizado (desktop, mobile, tablet)."
            tests:
              - not_null
          - name: country
            description: "País de origem da sessão (código ISO 3166-1)."
            tests:
              - not_null
          - name: page_views
            description: "Número de páginas visualizadas na sessão."
          - name: utm_source
            description: "Fonte UTM da campanha de marketing."
          - name: utm_campaign
            description: "Nome da campanha UTM."
          - name: is_bot
            description: "Indica se a sessão foi identificada como tráfego automatizado (bot)."
            tests:
              - not_null

      - name: raw_searches
        description: "Registro de buscas por disponibilidade de veículos realizadas nas sessões."
        columns:
          - name: search_id
            description: "Identificador único (UUID) da busca."
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: session_id
            description: "Sessão (UUID) na qual a busca foi realizada."
            tests:
              - not_null
          - name: searched_at
            description: "Timestamp do momento da busca."
            tests:
              - not_null
          - name: pickup_location
            description: "Local/cidade de retirada do veículo."
            tests:
              - not_null
          - name: dropoff_location
            description: "Local/cidade de devolução do veículo."
          - name: pickup_date
            description: "Data desejada para retirada."
            tests:
              - not_null
          - name: dropoff_date
            description: "Data desejada para devolução."
          - name: car_category
            description: "Categoria de veículo filtrada (economy, suv, luxury, pickup, minivan)."
          - name: num_results
            description: "Quantidade de ofertas retornadas no resultado."
          - name: partner_id_clicked
            description: "Identificador do parceiro cujo card foi clicado pelo usuário."
          - name: price_shown
            description: "Menor preço exibido na busca (em R$)."

      - name: raw_bookings
        description: "Registro de todas as reservas que foram finalizadas dentro da plataforma."
        columns:
          - name: booking_id
            description: "Identificador único da reserva (ex: BKG0000001)."
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: session_id
            description: "Sessão (UUID) em que a reserva foi concluída."
            tests:
              - not_null
          - name: user_id
            description: "Identificador (UUID) do usuário."
          - name: partner_id
            description: "Identificador do parceiro com quem a reserva foi feita."
            tests:
              - not_null
          - name: booked_at
            description: "Timestamp de realização da reserva."
            tests:
              - not_null
          - name: pickup_date
            description: "Data de retirada do veículo."
            tests:
              - not_null
          - name: dropoff_date
            description: "Data de devolução do veículo."
          - name: pickup_location
            description: "Local de retirada do veículo."
          - name: car_category
            description: "Categoria do veículo reservado."
          - name: daily_rate
            description: "Valor cobrado por diária (na moeda local)."
          - name: total_amount
            description: "Valor total da reserva."
          - name: currency
            description: "Moeda da transação em formato ISO 4217 (BRL, USD, ARS, CLP, COP)."
            tests:
              - not_null
          - name: status
            description: "Status da reserva (confirmed, pending, cancelled, no_show, completed)."
            tests:
              - not_null
          - name: payment_method
            description: "Forma de pagamento utilizada (credit_card, pix, boleto, debit_card)."

      - name: raw_cancellations
        description: "Registro de todos os eventos de cancelamento de reservas."
        columns:
          - name: cancellation_id
            description: "Identificador único (UUID) do cancelamento."
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: booking_id
            description: "Identificador da reserva cancelada."
            tests:
              - not_null
          - name: cancelled_at
            description: "Timestamp em que o cancelamento foi efetuado."
            tests:
              - not_null
          - name: reason
            description: "Motivo informado para o cancelamento."
          - name: cancelled_by
            description: "Agente que solicitou o cancelamento (customer, partner, system, admin)."
          - name: refund_amount
            description: "Valor reembolsado ao cliente (em R$)."
          - name: refund_status
            description: "Status do reembolso (processed, pending, denied)."
          - name: days_before_pickup
            description: "Dias de antecedência entre o cancelamento e a data de retirada."