# --------------------------
# Fato Cancelamentos
# --------------------------
  - name: fct_cancelamentos
    description: "Tabela fato responsável por armazenar informações dos motivos e características para entender os cancelamentos que ocorrem de reservas/locação."
    group: analytics_engineering
    access: public
    config:
      contract: # Contrato de dados
        enforced: true 
    tags: ["marts", "fato", "cancelamento", "motivo"]
    meta:
      owner: "analytics_engineering"
      dominio: "usuarios"
      nivel_criticidade: "alto"
      sla_atualizacao: "diario"
      consumidores: ["camada_semantica", "analise_ad_hoc"]
      #contem_pii: false    
    columns:
      - name: sk_usuario
        description: "Surrogate Key do usuário, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de usuário."
        datatype: varchar
        constraint:
          - type: not_null           
        tests:
          - not_null 

    columns:
      - name: sk_parceiro
        description: "Surrogate Key do parceiro, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de parceiro."
        datatype: varchar    

    columns:
      - name: sk_data_cancelamento
        description: "Surrogate Key de data, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de data."
        datatype: varchar
        constraint:
          - type: not_null           
        tests:
          - not_null

    columns:
      - name: sk_motivacao_cancelamento
        description: "Surrogate Key de motivação cancelamento, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de motivação cancelamento."
        datatype: varchar
        constraint:
          - type: not_null           
        tests:
          - not_null

    columns:
      - name: id_reserva
        description: "Dimensão degenerada, que tem por objetivo identificar qual é identificador da reserva/locação."
        datatype: int
        constraint:
          - type: not_null           
        tests:
          - not_null

    columns:
      - name: id_cancelamento
        description: "Dimensão degenerada, que tem por objetivo identificar qual é identificador do cancelamento."
        datatype: int
        constraint:
          - type: not_null           
        tests:
          - not_null  

    columns:
      - name: hr_cancelamento
        description: "Dimensão degenerada, tem por objetivo identificar a hora que ocorreu o cancelamento."
        datatype: time
        constraint:
          - type: not_null          
        tests:
          - not_null

    columns:
      - name: flg_cancelamento_tardio
        description: "Flag com responsabilidade de identificar se o cancelamento foi tardio ou não."
        datatype: boolean
        constraint:
          - type: not_null         
        tests:
          - not_null
          - accepted_values:
              values: [TRUE, FALSE]

    columns:
      - name: flg_cancelamento_sem_reembolso
        description: "Flag responsável por identificar se o cancelamento foi sem reembolso."
        datatype: boolean
        constraint:
          - type: not_null            
        tests:
          - not_null 
          - accepted_values:
              values: [TRUE, FALSE]

    columns:
      - name: qt_dias_antecedencia_retirada
        description: "Quantidade de dias que o veículo foi retirada com antecedência."
        datatype: int
        constraint:
          - type: not_null            
        tests:
          - not_null

    columns:
      - name: vlr_reembolsado_valido
        description: "Valor reembolsado de acordo com o cancelamento."
        datatype: decimal(10,2)
        constraint:
          - type: not_null          
        tests:
          - not_null                                

# --------------------------
# Fato Reservas
# --------------------------
  - name: fct_reservas
    description: "Tabela fato responsável por armazenar informações de reserva/locação por usuário e parceiro, para mensurar resultados e gerar ações estratégicas."
    group: analytics_engineering
    access: public
    config:
      contract: # Contrato de dados
        enforced: true 
    tags: ["marts", "fato", "cancelamento", "reserva", "locacao"]
    meta:
      owner: "analytics_engineering"
      dominio: "usuarios"
      nivel_criticidade: "alto"
      sla_atualizacao: "diario"
      consumidores: ["camada_semantica", "analise_ad_hoc"]    
    columns:
      - name: sk_reserva
        description: "Surrogate Key da reserva, diferente das outras surrogates keys, essa está na tabela somente para manter a integridade em formato transacional."
        datatype: varchar
        constraint:
          - type: not_null
          - type: unique
          - type: primary_key        
        tests:
          - unique
          - not_null

      - name: sk_usuario
        description: "Surrogate Key do usuário, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de usuário."
        datatype: varchar
        constraint:
          - type: foreign_key
            to: ref('dim_usuarios')
            to_columns: [sk_usuario]
        tests:
          - relationships:
              to: ref('dim_usuarios')
              field: sk_usuario # Realiza integridade referencial para garantir que a SK exista

      - name: sk_parceiro
        description: "Surrogate Key do parceiro, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de parceiro."
        datatype: varchar
        constraint:
          - type: foreign_key
            to: ref('dim_parceiros')
            to_columns: [sk_parceiro]        
        tests:
          - relationships:
              to: ref('dim_parceiros')
              field: sk_parceiro # Realiza integridade referencial para garantir que a SK exista

      - name: sk_data_reserva
        description: "Surrogate Key do data de reserva, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de data."
        datatype: varchar
        constraint:
          - type: not_null
          - type: foreign_key
            to: ref('dim_data')
            to_columns: [sk_data]             
        tests:
          - not_null
          - relationships:
              to: ref('dim_data')
              field: sk_data # Realiza integridade referencial para garantir que a SK exista       

      - name: sk_data_retirada
        description: "Surrogate Key do data de retirada, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de data."
        datatype: varchar
        constraint:
          - type: not_null
          - type: foreign_key
            to: ref('dim_data')
            to_columns: [sk_data]          
        tests:
          - not_null
          - relationships:
              to: ref('dim_data')
              field: sk_data # Realiza integridade referencial para garantir que a SK exista                     

      - name: sk_data_devolucao
        description: "Surrogate Key do data de devolucao, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de data."
        datatype: varchar
        constraint:
          - type: not_null
          - type: foreign_key
            to: ref('dim_data')
            to_columns: [sk_data]          
        tests:
          - not_null
          - relationships:
              to: ref('dim_data')
              field: sk_data # Realiza integridade referencial para garantir que a SK exista

      - name: sk_detalhe_reserva
        description: "Surrogate Key do detalhe da reserva, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de detalhe da reserva."                
        datatype: varchar        

      - name: id_reserva
        description: "Dimensão degenerada que responsável por evidenciar o identificar natural da reserva/locação."
        datatype: int
        constraint:
          - type: not_null
          - type: unique      
        tests:
          - not_null
          - unique    

      - name: hr_reserva
        description: "Dimensão degenerada responsável por evidenciar a hora que foi realizada a reserva/locação."
        datatype: time
        constraint:
          - type: not_null
        tests:
          - not_null

      - name: flg_valor_acima_media
        description: "Dimensão degenerada cujo é uma flag, responsável por identificar se o valor realizado está acima da média."
        datatype: boolean
        constraint:
          - type: not_null        
        tests:
          - not_null
          - accepted_values:
              values: [TRUE, FALSE]   

      - name: flg_suspeita_fraude_usuario
        description: "Dimensão degenerada cujo é uma flag, com objetivo de identificar se é possível fraude ou não a reserva/locação."
        datatype: boolean
        constraint:
          - type: not_null          
        tests:
          - not_null
          - accepted_values:
              values: [TRUE, FALSE]

      - name: qt_dias_locacao
        description: "Quantidade de dias de locação, ou seja, quantos dias essa reserva/locação ficou ativa juntamente com o veículo."
        datatype: int
        constraint:
          - type: not_null
          - type: check
            expression: qt_dias_locacao >= 0
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: vlr_total_reserva
        description: "Valor total da resserva/locação que foi cobrado via plataforma."
        datatype: decimal(10,2)
        constraint:
          - type: not_null
          - type: check
            expression: vlr_total_reserva >= 0        
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0              

      - name: vlr_total_reserva
        description: "Valor total da resserva/locação que foi cobrado via plataforma."
        datatype: decimal(10,2)    
              
      - name: vlr_receita_liquida_reserva
        description: "Valor da receita liquida da resserva/locação que foi cobrado via plataforma."
        datatype: decimal(10,2)        

      - name: vlr_diaria
        description: "Valor da diária referente a locação/reserva do veículo na plataforma."
        datatype: decimal(10,2)        

# --------------------------
# Fato Sessões
# --------------------------
  - name: fct_sessoes
    description: "Tabela fato responsável por armazenar informações das sessões e navegações dos usuários dentro da plataforma, para mensurar e entender as características dos usuários."
    group: analytics_engineering
    access: public
    config:
      contract: # Contrato de dados
        enforced: true 
    tags: ["marts", "fato", "cancelamento", "sessoes", "buscas"]
    meta:
      owner: "analytics_engineering"
      dominio: "usuarios"
      nivel_criticidade: "alto"
      sla_atualizacao: "diario"
      consumidores: ["camada_semantica", "analise_ad_hoc"]      
    columns:
      - name: sk_sessao
        description: "Surrogate Key da sessao, diferente das outras surrogates keys, essa está na tabela somente para manter a integridade em formato transacional."
        datatype: varchar
        constraint:
          - type: not_null
          - type: unique
          - type: primary_key        
        tests:
          - unique
          - not_null

      - name: sk_usuario
        description: "Surrogate Key do usuário, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de usuário."
        datatype: varchar
        constraint:
          - type: foreign_key
            to: ref('dim_usuarios')
            to_columns: [sk_usuario]        
        tests:
          - relationships:
              to: ref('dim_usuarios')
              field: sk_usuario # Realiza integridade referencial para garantir que a SK exista          

      - name: sk_data_inicio_sessao
        description: "Surrogate Key do data do início da sessão, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de data."
        datatype: varchar
        constraint:
          - type: not_null
          - type: foreign_key
            to: ref('dim_data')
            to_columns: [sk_data]        
        tests:
          - not_null
          - relationships:
              to: ref('dim_data')
              field: sk_data # Realiza integridade referencial para garantir que a SK exista       

      - name: sk_data_final_sessao
        description: "Surrogate Key do data início da sessão, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de data."
        datatype: varchar
        constraint:
          - type: not_null
          - type: not_null
          - type: foreign_key
            to: ref('dim_data')
            to_columns: [sk_data]             
        tests:
          - not_null
          - relationships:
              to: ref('dim_data')
              field: sk_data # Realiza integridade referencial para garantir que a SK exista

      - name: sk_origem_campanha
        description: "Surrogate Key da origem da campanha, com base nessa chave é possível utiliza-la para realizar junção diretamente com a dimensão de origem de campanha."
        datatype: varchar
        constraint:
          - type: not_null
          - type: foreign_key
            to: ref('dim_origem_campanha')
            to_columns: [sk_origem_campanha]             
        tests:
          - relationships:
              to: ref('dim_origem_campanha')
              field: sk_origem_campanha # Realiza integridade referencial para garantir que a SK exista                  

      - name: id_sessao
        description: "Dimensão degenerada que responsável por evidenciar o identificar natural da sessao."
        datatype: int
        constraint:
          - type: not_null
        tests:
          - not_null

      - name: hr_inicial_sessao
        description: "Dimensão degenerada responsável por evidenciar a hora inicial da sessão."
        datatype: time
        constraint:
          - type: not_null        
        tests:
          - not_null

      - name: hr_final_sessao
        description: "Dimensão degenerada responsável por evidenciar a hora final da sessão."
        datatype: time
        constraint:
          - type: not_null        
        tests:
          - not_null          

      - name: flg_houve_clique
        description: "Dimensão degenerada cujo é uma flag, por identificar se o usuário interagiu e clicou em nas pesquisas."
        datatype: boolean
        constraint:
          - type: not_null        
        tests:
          - not_null
          - accepted_values:
              values: [TRUE, FALSE] 

      - name: flg_volume_busca_anormal
        description: "Dimensão degenerada cujo é uma flag, identifica se o usuário está realizando buscas excessivas."
        datatype: boolean
        constraint:
          - type: not_null        
        tests:
          - not_null
          - accepted_values:
              values: [TRUE, FALSE]               

      - name: qt_duracao_sessao_minutos
        description: "Quantidade em minutos da duração das sessões dentro da plataforma."
        datatype: int
        constraint:
          - type: not_null    
          - type: check
            expression: qt_duracao_sessao_minutos >= 0     
        tests:
          - not_null         
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: qt_paginas_vistas
        description: "Quantidade de páginas que foram visitadas pelo usuário."
        datatype: int
        constraint:
          - type: not_null    
          - type: check
            expression: qt_paginas_vistas >= 0          
        tests:
          - not_null         
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: qt_total_buscas
        description: "Quantidade total de buscas que foram realizadas durante a sessão na plataforma."
        datatype: int
        constraint:
          - type: not_null    
          - type: check
            expression: qt_total_buscas >= 0          
        tests:
          - not_null         
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: vlr_menor_preco_pesquisado
        description: "Valor do menor preço pesquisado pelo usuáiro dentro da plataforma de dados."
        datatype: decimal(10,2)
        constraint:
          - type: not_null    
          - type: check
            expression: vlr_menor_preco_pesquisado >= 0          
        tests:
          - not_null         
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0